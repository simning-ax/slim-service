openapi: 3.0.3
info:
  title: Slim Service Template API
  version: 0.0.0
  description: >-
    OpenAPI för autentiserings- och användarhanteringstjänster i simning.ax-miljön

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Service health information
      responses:
        '200':
          description: Health information
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - data
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    required:
                      - status
                      - service
                      - version
                      - checks
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                          - degraded
                      service:
                        type: string
                        example: slim-service
                      version:
                        type: string
                        example: 1.5.0
                      checks:
                        type: object
                        additionalProperties:
                          type: string

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true


  responses:
    UnauthorizedResponse:
      description: Autentisering saknas
      content:
        application/json:
          schema:
            type: object
            required:
              - statusCode
              - error
            properties:
              statusCode:
                type: integer
                example: 401
              error:
                $ref: '#/components/schemas/ErrorResponse'

    ForbiddenResponse:
      description: Saknar behörighet
      content:
        application/json:
          schema:
            type: object
            required:
              - statusCode
              - error
            properties:
              statusCode:
                type: integer
                example: 403
              error:
                $ref: '#/components/schemas/ErrorResponse'